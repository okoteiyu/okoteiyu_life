<body class="game-page" data-asset-startup="loading">
 <main class="game-shell" id="game" inert aria-label="おこていゆのゲーム画面">

  <header class="game-header" aria-label="ゲームのヘッダー">
   <button class="hero-rank" id="rankTrigger" type="button" aria-label="ヒーローランク Cの説明"><span class="hero-rank__label">RANK</span><span class="hero-rank__value" id="rankValue">C</span></button>
   <div class="current-location"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m3 9 7-6 7 6M5 8v8h10V8M8 16v-5h4v5"/></svg><span id="locationName">おこていゆハウス</span></div>
   <button class="options-trigger" id="optionsTrigger" type="button" aria-label="オプションを開く" aria-haspopup="dialog" aria-controls="optionsDialog"><span><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="5" height="5" rx="1.5"/><rect x="12" y="3" width="5" height="5" rx="1.5"/><rect x="3" y="12" width="5" height="5" rx="1.5"/><rect class="options-dot" x="12" y="12" width="5" height="5" rx="2"/></svg></span></button>
   <div class="header-gauges" aria-label="おこていゆの穏やかポイントと怒りポイント">
    <button class="header-gauge header-gauge--calm" id="calmTrigger" type="button" aria-label="穏やかポイントの説明"><span class="header-gauge__label">穏やか</span><strong class="header-gauge__value" id="calmValue">0</strong><span class="header-point-unit">pt</span></button>
    <button class="header-gauge header-gauge--anger" id="angerTrigger" type="button" aria-label="怒りポイントの説明"><span class="header-gauge__label">怒り</span><strong class="header-gauge__value" id="angerValue">0/3</strong><span id="angerGauge" hidden role="progressbar" aria-label="怒りポイント" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0"></span></button>
   </div>
   <svg class="game-header__line" viewBox="0 0 400 6" preserveAspectRatio="none" aria-hidden="true"><path d="M14 2C70 5 100 0 150 2S250 4 285 2S350 4 386 2"/></svg>
  </header>
  <section class="main-view" id="mainView" aria-label="正方形のメインビュー">
   <svg class="main-view__border" viewBox="0 0 400 400" aria-hidden="true"><defs><path id="mainViewOutline" d="M20 8 C90 8 106 6 144 7 C190 9 210 7 250 7 C300 6 330 8 380 8 Q392 8 392 20 C392 90 394 108 393 146 C391 188 393 210 393 250 C394 290 392 324 392 380 Q392 392 380 392 C310 392 288 394 248 393 C206 391 182 393 144 393 C104 392 76 392 20 392 Q8 392 8 380 C8 310 6 286 7 246 C9 204 7 180 7 142 C6 104 8 72 8 20 Q8 8 20 8 Z"/></defs><use class="main-view__paper" href="#mainViewOutline"/></svg>
   <div class="main-view__surface" id="viewSurface"></div>
   <svg class="main-view__border" viewBox="0 0 400 400" aria-hidden="true"><use class="main-view__stroke" href="#mainViewOutline"/><use class="main-view__stroke main-view__stroke--inside" href="#mainViewOutline" transform="translate(5 5) scale(.975)"/></svg>
   <div class="view-input-shield" id="viewInputShield" hidden aria-hidden="true"></div>
   <div class="dialogue-viewport view-message" id="messageOverlay" hidden><section class="message-frame" id="message" data-kind="narration" aria-label="メッセージ"><img class="message-frame__sticker" src="assets/naruto-sticker.png" alt="" width="68" height="68"><span class="message-frame__speaker">ナレーション</span><span class="message-frame__sprig" aria-hidden="true"><i></i><i></i><i></i></span><p class="message-frame__text" aria-live="polite" aria-atomic="true"><span class="message-frame__line">おこていゆは、焼いたベーコンをじっと見つめている。</span><span class="message-frame__line">どうやら、研究の手が止まってしまったようだ。</span></p><button class="message-frame__continue" type="button" aria-label="次のメッセージを表示"><span aria-hidden="true"></span></button></section></div>
   <button class="message-replay" id="messageReplay" type="button" aria-label="最後のメッセージを再表示" title="最後のメッセージを再表示" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 6a6 6 0 1 1-1 7M5 2v4H1"/><path d="M8 8h5m-5 3h5"/></svg><span>再表示</span></button>
  </section>
  <section class="interface-bay" aria-label="ビュー下の表示領域">
   <div class="lower-regions">
    <div class="lower-left">
     <div class="lower-left__top">
      <section class="area-map" id="areaMap" aria-labelledby="areaMapTitle"><header class="area-map__header"><h2 id="areaMapTitle">おこていゆハウス</h2><span id="areaMapHint">お部屋の地図</span></header><div class="area-map__content" id="areaMapContent"></div></section>
     </div>
     <nav class="lower-left__bottom" aria-label="コレクションとバトル">
      <button class="lower-action" id="collectionTrigger" type="button" aria-controls="optionsDialog" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m5 11 11-6 11 6v15H5V11Zm0 0 11 6 11-6M16 17v10M11 8l11 6"/><path d="m12 22 2 1"/></svg><span class="lower-action__label">コレクション</span></button>
      <button class="lower-action" id="mapTrigger" type="button" aria-label="バトルを開く" aria-controls="optionsDialog" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 32 32" aria-hidden="true" data-icon="battle"><path d="m5 4 5 1 14 14-5 5L5 10 4 5l1-1Z"/><path d="m17 26 9-9m-4.5 4.5 5 5m-2 1 3-3M20 7l5-3 3 3-2 5-4 4M12 20l-6 6m-2-7 9 9m-9-3 3 3"/></svg><span class="lower-action__label">バトル</span></button>
     </nav>
    </div>
    <section class="lower-right home-actions" id="homeChoices" aria-labelledby="homeChoicesTitle"><header class="home-actions__heading"><span>あなたから</span><h2 id="homeChoicesTitle">どうする？</h2></header><nav class="home-actions__list" aria-label="おこていゆハウスでの選択肢"><button class="home-choice" type="button" data-home-choice="interfere"><span class="home-choice__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 12V5a2 2 0 0 1 4 0v7m0-3h2l5 3-2 8H9l-5-6 2-2 3 3"/></svg></span><span class="home-choice__bonus" hidden>ボーナス</span><span class="home-choice__label">ちょっかいをかける</span><span class="home-choice__arrow" aria-hidden="true">›</span></button><button class="home-choice" type="button" data-home-choice="food"><span class="home-choice__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5V3Zm0 7h14M8 6v2m0 5v3"/></svg></span><span class="home-choice__label">食べ物を用意する</span><span class="home-choice__arrow" aria-hidden="true">›</span></button><button class="home-choice" type="button" data-home-choice="chair"><span class="home-choice__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12V7a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v5M3 10v8h18v-8M6 18v3m12-3v3M6 14h12"/></svg></span><span class="home-choice__label">椅子を掃除する</span><span class="home-choice__arrow" aria-hidden="true">›</span></button><button class="home-choice" type="button" data-home-choice="bed"><span class="home-choice__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v12m18-12v12M3 16h18M3 9h18v7H3m3-7V6h6v3"/></svg></span><span class="home-choice__label">ベットを綺麗にする</span><span class="home-choice__arrow" aria-hidden="true">›</span></button></nav></section>
   </div>
  </section>
 </main>
 <dialog class="options-dialog" id="optionsDialog" aria-labelledby="optionsTitle">
  <header class="options-heading"><button class="options-back" id="optionsBack" type="button" aria-label="戻る" hidden>‹</button><div class="options-heading__text"><span class="options-eyebrow">OKOTEIYU / MENU</span><h2 id="optionsTitle" tabindex="-1">オプション</h2></div><button class="options-close" id="optionsClose" type="button" aria-label="オプションを閉じる">×</button></header>
  <div class="options-body" id="optionsBody"></div>
 </dialog>
 <input type="file" id="mediaFile" accept="image/*,video/*" hidden aria-label="端末内の画像または動画を表示する。ファイルは送信されません。">
 <div class="game-toast" id="toast" role="status"></div>
 <dialog class="asset-loading" id="assetLoadingDialog" open aria-labelledby="assetLoadingTitle" aria-describedby="assetLoadingDescription" aria-modal="true" data-state="fetching">
  <header class="asset-loading__top"><span class="asset-loading__emblem" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M21 12c-2-6-12-6-14 1-3 9 9 15 15 8 4-5-2-11-7-8-4 2-1 7 2 5"/><path d="m23 4 1 3 3 1m-20 17-2 2"/></svg></span><div><span class="asset-loading__eyebrow">OKOTEIYU / LOADING</span><h2 id="assetLoadingTitle">読み込んでいます</h2></div></header>
  <p class="asset-loading__description" id="assetLoadingDescription">おこていゆの世界を準備しています。少しお待ちください。</p>
  <div class="asset-loading__meter"><progress id="assetLoadingProgress" max="100" value="0" aria-label="ゲームの読み込み進捗" aria-valuetext="0%・読み込みを開始しています"></progress><output class="asset-loading__percent" id="assetLoadingPercent">0%</output></div>
  <p class="asset-loading__details" id="assetLoadingDetails">通信を開始しています…</p>
  <p class="asset-loading__label" id="assetLoadingLabel" role="status" aria-live="polite">もう少しお待ちください…</p>
  <button class="asset-loading__tip" id="assetLoadingTip" type="button" data-kind="warning" aria-label="次のTipsを表示" aria-describedby="assetLoadingTipCopy">
   <span class="asset-loading__tip-top"><span id="assetLoadingTipKind">セーブの注意</span><span id="assetLoadingTipCount">1 / 10</span></span>
   <span class="asset-loading__tip-copy" id="assetLoadingTipCopy" role="status" aria-live="polite" aria-atomic="true"><strong>セーブデータを守ろう</strong><span>ブラウザのサイトデータを消すと、セーブデータも消えます。大切な記録は「オプション」→「セーブデータ読み書き」からファイルに書き出しておきましょう。</span></span>
   <span class="asset-loading__tip-next">タップで次のヒント<span aria-hidden="true">→</span></span>
  </button>
  <template id="assetLoadingMoreTips">
   <article data-kind="tip"><h3>お出かけ前に、ひと休み</h3><p>おこていゆハウスで食べる・飲む・寝る・くつろぐと、穏やかポイントが貯まります。パトロールや訓練の前に、ゆっくり準備しましょう。</p></article>
   <article data-kind="tip"><h3>最初の練習相手はプニム</h3><p>プニムは最初から訓練で会える珍生物です。「バトル」から訓練所へ行き、「訓練（易）」で経験を積んでみましょう。</p></article>
   <article data-kind="tip"><h3>もちものを見直してみよう</h3><p>コレクションから、もちもの・オーラ・技を設定できます。手ごわい相手には、装備の組み合わせを変えてみるのもおすすめです。</p></article>
   <article data-kind="tip"><h3>オーラを集めて、少しずつ強く</h3><p>戦いで相手全員を疲れさせると、オーラを手に入れることがあります。同じオーラを集めると、オーラのレベルが上がります。</p></article>
   <article data-kind="tip"><h3>戦闘のあとは、ボーナスのちょっかい</h3><p>戦闘から帰ったあとの最初のちょっかいは、穏やかポイントを使いません。怒りを貯めると、おこていゆイベントで新しい力に出会えるかもしれません。</p></article>
   <article data-kind="tip"><h3>ここぞというときの、かけごえ</h3><p>戦闘中のかけごえで、スーパーおこていゆ状態になるようお願いできます。使うタイミングを工夫してみましょう。</p></article>
   <article data-kind="tip"><h3>妖精たちに、こっそりお願い</h3><p>ナスは苦手、トマトは好物。道中で妖精にお願いすると、おこていゆの進路に働きかけられます。</p></article>
   <article data-kind="warning"><h3>別の端末へは、ファイルで引き継ぎ</h3><p>セーブデータは端末やブラウザを変えても自動では共有されません。書き出したセーブファイルと、そのパスワードを使って引き継ぎましょう。</p></article>
   <article data-kind="warning"><h3>ひと区切りついたら、おこていゆハウスへ</h3><p>道中や戦闘の途中でブラウザを閉じると、最後に保存されたホームの状態から再開します。おこていゆハウスでの進行は自動保存されます。</p></article>
  </template>
  <p class="asset-loading__error" id="assetLoadingError" role="alert" hidden></p>
  <button id="assetLoadingRetry" type="button" hidden>再試行</button>
  <div class="asset-loading__fallback" id="assetLoadingFallback">この表示が続く場合は、通信環境を確認して開き直してください。<button type="button" onclick="location.reload()">ページを再読み込み</button></div>
 </dialog>
 <script type="module" src="startup.js"></script>
